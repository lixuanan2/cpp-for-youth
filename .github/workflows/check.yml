# Check every module, then publish the site from main only when every check has passed.
# check.py, the clang 16 check and the project checks run every time. Chrome checks only what the change can affect (see
# .github/browser_plan.py): nothing for README or home page edits, the changed lessons or projects, or everything split
# over four runners. The weekly run and a manual run check everything.
name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  # A change to text only (see plan) checks the document links on Ubuntu and skips Windows and the programs.
  check:
    needs: plan
    strategy:
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.text == 'true' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      CXX: g++
      TEXT: ${{ needs.plan.outputs.text }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: basics
        working-directory: basics
        shell: bash
        run: |
          if [ "$TEXT" = true ]; then
            python -c "import sys; sys.path.insert(0, 'tools'); import check; print('PASS: text only, %d document links' % check.check_docs())"
          else
            python tools/check.py
          fi
  # Students read errors in cpp.sh, which compiles with clang 16. The pages quote its words, kept as the
  # "clang" entries in claims.json, so they are checked here with the same clang major version.
  cppsh-clang:
    needs: plan
    if: needs.plan.outputs.text != 'true'
    runs-on: ubuntu-24.04
    env:
      CXX: clang++-16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: clang 16
        run: |
          command -v clang++-16 || { sudo apt-get update -q && sudo apt-get install -yq clang-16; }
          clang++-16 --version
      - name: basics
        working-directory: basics
        run: python tools/check.py
  # The project module: dist/ current and without answers, demos run, then every stage the way a student meets it:
  # the starter compiles and fails its tests, the answer passes them in C++98 and C++11, the front end plays.
  project:
    needs: plan
    if: needs.plan.outputs.text != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: project
        working-directory: project
        run: |
          g++ --version
          python tools/check.py
          python tools/verify.py
  # What the browser job checks, from the files this push or pull request changed.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      text: ${{ steps.plan.outputs.text }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "$BASE" ]; then git fetch -q --depth=1 origin "$BASE" || true; fi
          matrix=$(python3 .github/browser_plan.py "$BASE")
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          # text=true when every changed file is a note, a page of prose or the home page: nothing a compiler,
          # check.py on Windows or a stage test can see. Not known (weekly, manual, new branch): false.
          text=false
          if [ -n "$BASE" ] && files=$(git diff --name-only "$BASE" HEAD 2>/dev/null) && [ -n "$files" ]; then
            other=$(echo "$files" | grep -vE '(^|/)(README|CONTRIBUTING|LICENSE|AGENTS|CLAUDE)\.md$|^basics/PROMPT\.md$|^basics/docs/|^home/|^\.github/assets/|^\.github/ISSUE_TEMPLATE/|^\.github/pull_request_template\.md$|^\.claude/' || true)
            [ -z "$other" ] && text=true
          fi
          echo "text only: $text"
          echo "text=$text" >> "$GITHUB_OUTPUT"

  # Pages in real Chrome: layout, quizzes, yellow boxes run against a real C++ compiler, IDE links. With nothing to check
  # the job still succeeds, so deploy runs.
  browser:
    needs: plan
    name: browser (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    env:
      BASICS: ${{ matrix.basics }}
      SHARD: ${{ matrix.shard }}
      PROJECTS: ${{ matrix.project }}
      WORK: ${{ matrix.basics != '' || matrix.project != '' }}
    steps:
      - if: env.WORK != 'true'
        run: echo "No page can look different after this change, so there is nothing to open in Chrome."
      - if: env.WORK == 'true'
        uses: actions/checkout@v4
      - if: env.WORK == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - if: env.WORK == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chinese fonts and the Chrome sandbox
        if: env.WORK == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq fonts-noto-cjk
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: basics
        if: env.BASICS != ''
        working-directory: basics
        run: |
          if [ "$BASICS" = all ]; then node tools/check_browser.mjs --shard "$SHARD"; else node tools/check_browser.mjs $BASICS; fi
      - name: project
        if: env.PROJECTS != ''
        working-directory: project
        run: |
          if [ "$PROJECTS" = all ]; then node tools/check_browser.mjs; else node tools/check_browser.mjs $PROJECTS; fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots-${{ strategy.job-index }}
          path: |
            basics/.preview
            project/.preview
          include-hidden-files: true

  # The site goes up only after every check above passes, and never from a pull request.
  deploy:
    needs: [check, cppsh-clang, project, browser]
    # Skipped jobs (a text-only change) do not stop the site; a failed or cancelled one does.
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The home page sits at the top; each module's dist/ goes under its own folder name.
      - name: Assemble the site
        run: |
          mkdir -p _site/fonts
          cp home/index.html _site/
          cp basics/vendor/fonts/*.woff2 basics/vendor/fonts/JetBrainsMono-OFL.txt _site/fonts/
          cp -R basics/dist _site/basics
          cp -R project/dist _site/project
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
