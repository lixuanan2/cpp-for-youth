# Check every module, then publish the site from main only when every check has passed.
name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: basics
        working-directory: basics
        run: python tools/check.py
  # Students read errors in cpp.sh, which compiles with clang 16. The pages quote its words, kept as the
  # "clang" entries in claims.json, so they are checked here with the same clang major version.
  cppsh-clang:
    runs-on: ubuntu-24.04
    env:
      CXX: clang++-16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: clang 16
        run: |
          command -v clang++-16 || { sudo apt-get update -q && sudo apt-get install -yq clang-16; }
          clang++-16 --version
      - name: basics
        working-directory: basics
        run: python tools/check.py
  # The project module: dist/ current and without answers, demos run, then every stage the way a student meets it:
  # the starter compiles and fails its tests, the answer passes them in C++98 and C++11, the front end plays.
  project:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: project
        working-directory: project
        run: |
          g++ --version
          python tools/check.py
          python tools/verify.py
  # Every page in real Chrome: layout, quizzes, yellow boxes run against a real C++ compiler, IDE links.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chinese fonts and the Chrome sandbox
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq fonts-noto-cjk
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: basics
        working-directory: basics
        run: node tools/check_browser.mjs
      - name: project
        working-directory: project
        run: node tools/check_browser.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: |
            basics/.preview
            project/.preview
          include-hidden-files: true

  # The site goes up only after every check above passes, and never from a pull request.
  deploy:
    needs: [check, cppsh-clang, project, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The home page sits at the top; each module's dist/ goes under its own folder name.
      - name: Assemble the site
        run: |
          mkdir -p _site/fonts
          cp home/index.html _site/
          cp basics/vendor/fonts/*.woff2 basics/vendor/fonts/JetBrainsMono-OFL.txt _site/fonts/
          cp -R basics/dist _site/basics
          cp -R project/dist _site/project
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
